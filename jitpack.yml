jdk:
  - openjdk11
before_install:
  - chmod +x gradlew
install:
  - echo "常规构建过程"
  - ./gradlew :maven-publish:assembleRelease

# 以下手动创建构件
env:
  GROUP: com.github.mimicode
  ARTIFACT: albcpackage

jitpack:
  before:
    - mkdir -p ~/.m2/repository/com/github/mimicode/albcpackage/1.0.0
    - ls -la libs/
    - find libs/ -name "*.jar" -o -name "*.aar" | while read file; do BASENAME=$(basename "$file"); ARTIFACT_NAME="${BASENAME%.*}"; mkdir -p ~/.m2/repository/com/github/mimicode/albcpackage/$ARTIFACT_NAME/1.0.0; cp "$file" ~/.m2/repository/com/github/mimicode/albcpackage/$ARTIFACT_NAME/1.0.0/"$ARTIFACT_NAME-1.0.0.${file##*.}"; echo "Copied $file to ~/.m2/repository/com/github/mimicode/albcpackage/$ARTIFACT_NAME/1.0.0/$ARTIFACT_NAME-1.0.0.${file##*.}"; done
    - echo "直接构建artifacts完成"
    - find ~/.m2/repository/com/github/mimicode/albcpackage -type f | sort 