plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    compileSdkVersion 33
    
    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 33
        
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    lintOptions {
        abortOnError false
    }
}

// 将libs目录复制到maven-publish模块中
task copyLibs(type: Copy) {
    from '../libs'
    into "${buildDir}/outputs/aar/"
}

preBuild.dependsOn(copyLibs)

// 创建一个空的AAR文件
task createDummyAar {
    doLast {
        new File("${buildDir}/outputs/aar/maven-publish-release.aar").withWriter { writer ->
            writer.write("This is a placeholder AAR file.")
        }
    }
}

afterEvaluate {
    assembleRelease.finalizedBy(createDummyAar)
    
    publishing {
        publications {
            release(MavenPublication) {
                groupId = 'com.github.mimicode.albcpackage'
                artifactId = 'all-libs'
                version = '1.0.0'
                
                artifact("${buildDir}/outputs/aar/maven-publish-release.aar")
            }
        }
    }
} 